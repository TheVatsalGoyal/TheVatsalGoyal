name: Generate Snake
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: YourUsername
          outputs: dist/github-snake-dark.svg?color_snake=0x58a6ff&color_dots=#0d1117,#161b22,#21262d,#30363d,#58a6ff
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
