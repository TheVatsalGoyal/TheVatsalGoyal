<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <style>
      /* ── Base Background ── */
      .bg {
        fill: #0d1117;
      }

      /* ── Gradient Mesh Blobs ── */
      .blob {
        mix-blend-mode: screen;
        opacity: 0.45;
      }
      .blob-1 {
        fill: #1a1a2e;
        animation: drift-1 14s ease-in-out infinite alternate;
      }
      .blob-2 {
        fill: #16213e;
        animation: drift-2 18s ease-in-out infinite alternate;
      }
      .blob-3 {
        fill: #0f3460;
        animation: drift-3 20s ease-in-out infinite alternate;
      }
      .blob-4 {
        fill: #533483;
        opacity: 0.25;
        animation: drift-4 16s ease-in-out infinite alternate;
      }

      /* ── Floating Particles ── */
      .particle {
        fill: #58a6ff;
        opacity: 0;
        animation: sparkle 6s ease-in-out infinite;
      }
      .p1  { cx: 120; cy: 60;  r: 1.5; animation-delay: 0s;   }
      .p2  { cx: 250; cy: 200; r: 1;   animation-delay: 1.2s; }
      .p3  { cx: 400; cy: 40;  r: 1.8; animation-delay: 2.5s; }
      .p4  { cx: 550; cy: 180; r: 1.2; animation-delay: 0.8s; }
      .p5  { cx: 700; cy: 90;  r: 1.6; animation-delay: 3.1s; }
      .p6  { cx: 800; cy: 240; r: 1;   animation-delay: 1.7s; }
      .p7  { cx: 160; cy: 250; r: 1.3; animation-delay: 4s;   }
      .p8  { cx: 620; cy: 260; r: 1.4; animation-delay: 2s;   }
      .p9  { cx: 340; cy: 140; r: 1.1; animation-delay: 3.5s; }
      .p10 { cx: 780; cy: 50;  r: 1.7; animation-delay: 0.5s; }
      .p11 { cx: 60;  cy: 140; r: 1;   animation-delay: 4.5s; }
      .p12 { cx: 480; cy: 100; r: 1.5; animation-delay: 1s;   }

      /* ── Grid Lines ── */
      .grid-line {
        stroke: #21262d;
        stroke-width: 0.5;
        opacity: 0.4;
      }
      .grid-v { animation: grid-pulse 8s ease-in-out infinite; }
      .grid-h { animation: grid-pulse 8s ease-in-out infinite; animation-delay: 4s; }

      /* ── Scan Line ── */
      .scan-line {
        fill: url(#scanGrad);
        animation: scan 10s linear infinite;
      }

      /* ── Typography ── */
      .name {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 38px;
        font-weight: 700;
        fill: #e6edf3;
        letter-spacing: 1px;
        filter: drop-shadow(0 0 12px rgba(88,166,255,0.3));
      }
      .title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 16px;
        font-weight: 500;
        fill: #8b949e;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .tagline {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        font-weight: 400;
        fill: #58a6ff;
        letter-spacing: 0.5px;
      }
      .typing-cursor {
        fill: #58a6ff;
        animation: blink 1s step-end infinite;
      }

      /* ── Decorative Accent Lines ── */
      .accent-line {
        stroke: #58a6ff;
        stroke-width: 2;
        opacity: 0.6;
        stroke-linecap: round;
      }
      .accent-left  { animation: accent-in-left  1.5s ease-out forwards; }
      .accent-right { animation: accent-in-right 1.5s ease-out forwards; }

      /* ── Bottom Border Glow ── */
      .bottom-glow {
        fill: url(#bottomGrad);
        animation: glow-pulse 4s ease-in-out infinite alternate;
      }

      /* ═══════════════════════════════════
         KEYFRAMES
         ═══════════════════════════════════ */
      @keyframes drift-1 {
        0%   { transform: translate(0, 0)      scale(1);    }
        100% { transform: translate(80px, 30px) scale(1.15); }
      }
      @keyframes drift-2 {
        0%   { transform: translate(0, 0)        scale(1);   }
        100% { transform: translate(-60px, 40px) scale(1.1); }
      }
      @keyframes drift-3 {
        0%   { transform: translate(0, 0)       scale(1);    }
        100% { transform: translate(50px,-35px) scale(1.2);  }
      }
      @keyframes drift-4 {
        0%   { transform: translate(0, 0)        scale(1);   }
        100% { transform: translate(-40px,-20px) scale(1.1); }
      }
      @keyframes sparkle {
        0%, 100% { opacity: 0;   transform: translateY(0);    }
        50%      { opacity: 0.8; transform: translateY(-8px);  }
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50%      { opacity: 0; }
      }
      @keyframes scan {
        0%   { transform: translateY(-10px); }
        100% { transform: translateY(310px); }
      }
      @keyframes grid-pulse {
        0%, 100% { opacity: 0.15; }
        50%      { opacity: 0.4;  }
      }
      @keyframes accent-in-left {
        0%   { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0;   }
      }
      @keyframes accent-in-right {
        0%   { stroke-dashoffset: 120; }
        100% { stroke-dashoffset: 0;   }
      }
      @keyframes glow-pulse {
        0%   { opacity: 0.4; }
        100% { opacity: 0.9; }
      }
    </style>

    <!-- Gradients -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#58a6ff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#58a6ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Blur for blobs -->
    <filter id="softBlur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="40"/>
    </filter>
  </defs>

  <!-- ▸ Background -->
  <rect class="bg" width="900" height="300" rx="12"/>

  <!-- ▸ Animated Gradient-Mesh Blobs -->
  <g filter="url(#softBlur)">
    <ellipse class="blob blob-1" cx="200" cy="100" rx="220" ry="140"/>
    <ellipse class="blob blob-2" cx="650" cy="200" rx="200" ry="130"/>
    <ellipse class="blob blob-3" cx="450" cy="60"  rx="180" ry="120"/>
    <ellipse class="blob blob-4" cx="750" cy="80"  rx="160" ry="100"/>
  </g>

  <!-- ▸ Subtle Grid -->
  <g>
    <line class="grid-line grid-v" x1="150" y1="0" x2="150" y2="300"/>
    <line class="grid-line grid-v" x1="300" y1="0" x2="300" y2="300"/>
    <line class="grid-line grid-v" x1="450" y1="0" x2="450" y2="300"/>
    <line class="grid-line grid-v" x1="600" y1="0" x2="600" y2="300"/>
    <line class="grid-line grid-v" x1="750" y1="0" x2="750" y2="300"/>
    <line class="grid-line grid-h" x1="0" y1="75"  x2="900" y2="75"/>
    <line class="grid-line grid-h" x1="0" y1="150" x2="900" y2="150"/>
    <line class="grid-line grid-h" x1="0" y1="225" x2="900" y2="225"/>
  </g>

  <!-- ▸ Scan Line -->
  <rect class="scan-line" x="0" y="0" width="900" height="8" rx="4"/>

  <!-- ▸ Floating Particles -->
  <g>
    <circle class="particle p1"/>
    <circle class="particle p2"/>
    <circle class="particle p3"/>
    <circle class="particle p4"/>
    <circle class="particle p5"/>
    <circle class="particle p6"/>
    <circle class="particle p7"/>
    <circle class="particle p8"/>
    <circle class="particle p9"/>
    <circle class="particle p10"/>
    <circle class="particle p11"/>
    <circle class="particle p12"/>
  </g>

  <!-- ▸ Accent Lines -->
  <line class="accent-line accent-left"  x1="200" y1="160" x2="320" y2="160"
        stroke-dasharray="120" stroke-dashoffset="120"/>
  <line class="accent-line accent-right" x1="580" y1="160" x2="700" y2="160"
        stroke-dasharray="120" stroke-dashoffset="120"/>

  <!-- ▸ Text Content -->
  <text class="name"    x="450" y="115" text-anchor="middle">Your Name</text>
  <text class="title"   x="450" y="155" text-anchor="middle">B.Tech Computer Science &amp; Engineering Student</text>
  <text class="tagline" x="450" y="200" text-anchor="middle">Building the future, one commit at a time</text>

  <!-- ▸ Typing Cursor -->
  <rect class="typing-cursor" x="655" y="188" width="2" height="16" rx="1"/>

  <!-- ▸ Bottom Accent Glow -->
  <rect class="bottom-glow" x="100" y="296" width="700" height="4" rx="2"/>
</svg>
